name: Pacotes de release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Validar e anexar pacotes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Conferir a versão da release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== 'v' + version) {
            throw new Error('A tag deve corresponder a v' + version);
          }
          "
      - name: Instalar dependências
        run: npm ci
      - name: Auditar dependências
        run: npm audit --audit-level=high
      - name: Conferir tipos
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Gerar builds
        run: npm run build
      - name: Empacotar Chrome
        working-directory: .output/chrome-mv3
        run: zip -r ../snagly-chrome.zip .
      - name: Empacotar Firefox
        working-directory: .output/firefox-mv3
        run: zip -r ../snagly-firefox.zip .
      - name: Anexar pacotes à release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .output/snagly-chrome.zip .output/snagly-firefox.zip --clobber
