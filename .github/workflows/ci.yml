name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar vulnerabilidades altas e críticas
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --audit-level=high
      - name: Conferir TypeScript e configuração WXT
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Gerar extensões Chrome e Firefox
        run: npm run build
      - name: Disponibilizar builds para teste manual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snagly-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .output/chrome-mv3/
            .output/firefox-mv3/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  required:
    name: CI aprovado
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir aprovação de toda a matriz
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
